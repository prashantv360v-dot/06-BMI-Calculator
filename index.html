<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="cal">
            <h1>BMI Calculator</h1>
        <p>Height (in cm)</p>
        <input type="text" placeholder="Enter your height in meters"
         id="height">
        <p>Weight (in kg)</p>
        <input type="text" placeholder="Enter your weight in kilograms"
         id="weight">
        <button id="btn" onclick="calculateBMI()">Calculate</button>
        </div>
        <div id="result">

        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
